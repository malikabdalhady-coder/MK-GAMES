<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MK GAMES - الألعاب المضغوطة والريبيكات الاحترافية</title>
    <!-- Google Fonts Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #ff2a5f;
            --secondary: #9d4edd;
            --bg-dark: #0b0f19;
            --card-bg: #131c2e;
            --text-main: #f8f9fa;
            --text-muted: #94a3b8;
            --neon-glow: 0 0 15px rgba(255, 42, 95, 0.4);
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }
        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
        }
        header {
            background: rgba(11, 15, 25, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 42, 95, 0.2);
            position: sticky;
            top: 0;
            z-index: 1000;
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 26px;
            font-weight: 900;
            color: #fff;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .logo span {
            color: var(--primary);
            text-shadow: var(--neon-glow);
        }
        .search-bar {
            position: relative;
            width: 400px;
        }
        .search-bar input {
            width: 100%;
            padding: 12px 20px;
            padding-right: 45px;
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }
        .search-bar input:focus {
            border-color: var(--primary);
            box-shadow: var(--neon-glow);
        }
        .search-bar i {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }
        .container {
            max-width: 1400px;
            margin: 30px auto;
            padding: 0 20px;
        }
        .hero-banner {
            background: linear-gradient(135deg, rgba(157, 78, 221, 0.2), rgba(255, 42, 95, 0.2));
            border: 1px solid rgba(255, 42, 95, 0.3);
            border-radius: 20px;
            padding: 40px;
            margin-bottom: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            overflow: hidden;
        }
        .hero-content h1 {
            font-size: 36px;
            font-weight: 900;
            margin-bottom: 10px;
        }
        .hero-content p {
            color: var(--text-muted);
            font-size: 16px;
            margin-bottom: 20px;
            max-width: 600px;
        }
        .badge {
            background: var(--primary);
            color: #fff;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            display: inline-block;
            margin-bottom: 15px;
            box-shadow: var(--neon-glow);
        }
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }
        .game-card {
            background: var(--card-bg);
            border-radius: 15px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: 0.3s;
            display: flex;
            flex-direction: column;
            cursor: pointer;
        }
        .game-card:hover {
            transform: translateY(-8px);
            border-color: var(--primary);
            box-shadow: var(--neon-glow);
        }
        .game-img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            background: #1a233a;
        }
        .game-info {
            padding: 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .game-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 10px;
        }
        .game-meta {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 10px;
        }
        .download-btn {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: #fff;
            text-align: center;
            padding: 10px;
            border-radius: 8px;
            font-weight: 700;
            text-decoration: none;
            transition: 0.3s;
        }
        .download-btn:hover {
            opacity: 0.9;
            box-shadow: var(--neon-glow);
        }
        /* Modal Window */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(5px);
            justify-content: center;
            align-items: center;
            z-index: 2000;
            padding: 20px;
        }
        .modal-content {
            background: var(--card-bg);
            border: 1px solid rgba(255, 42, 95, 0.4);
            border-radius: 20px;
            width: 100%;
